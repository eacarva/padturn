# Windows installer (NSIS .exe) for Padturn. Runs on a Microsoft-hosted Windows agent.
# Not run yet: set up the pipeline in Azure DevOps pointing at this file, then run it by hand.
trigger: none
pr: none

pool:
  vmImage: windows-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: "20.x"

  - pwsh: |
      Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
      .\rustup-init.exe -y --default-toolchain stable --profile minimal
      echo "##vso[task.prependpath]$env:USERPROFILE\.cargo\bin"
    displayName: Rust

  - script: npm ci
    displayName: npm ci

  - script: node ui/model.test.mjs && node ui/layouts.test.mjs
    displayName: Testes

  - script: npx tauri build --bundles nsis
    displayName: Build

  - publish: src-tauri/target/release/bundle/nsis
    artifact: padturn-windows
